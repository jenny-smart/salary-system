# .github/workflows/scheduler.yml
#
# Lemon Clean 期別排程
#
# 這版不使用 GitHub cron。
# 排程由 GAS Trigger 負責。
# GAS 到時間後呼叫 GitHub workflow_dispatch。
#
# 手動執行：
#   period 留空：自動判斷目前期別
#   period 有值：指定期別，例如 202606-2
#   region 留空：全部地區
#   region 有值：只跑指定地區，例如 台北
#   action 預設：create_period

name: Lemon Clean 期別排程

on:
  workflow_dispatch:
    inputs:
      period:
        description: "指定期別，例如 202606-2；留空則自動判斷"
        required: false
        default: ""

      region:
        description: "指定地區，例如 台北；留空則全部地區"
        required: false
        default: ""

      action:
        description: "執行功能，例如 create_period"
        required: false
        default: "create_period"

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduler
        env:
          OAUTH_CLIENT_ID:     ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          NOTIFY_EMAIL:        ${{ secrets.NOTIFY_EMAIL }}
          FORCE_PERIOD:        ${{ github.event.inputs.period }}
          FORCE_REGION:        ${{ github.event.inputs.region }}
          FORCE_ACTION:        ${{ github.event.inputs.action }}
        run: |
          CMD="python -m modules.scheduler_service --force"

          if [ -n "$FORCE_PERIOD" ]; then
            CMD="$CMD --period $FORCE_PERIOD"
          fi

          if [ -n "$FORCE_REGION" ]; then
            CMD="$CMD --region $FORCE_REGION"
          fi

          if [ -n "$FORCE_ACTION" ]; then
            CMD="$CMD --action $FORCE_ACTION"
          fi

          echo "Execute: $CMD"
          eval "$CMD"
