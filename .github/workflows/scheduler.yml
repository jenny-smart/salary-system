name: Lemon Clean 期別排程

on:
  workflow_dispatch:
    inputs:
      period:
        description: "指定期別，例如 202606-2；留空則自動判斷"
        required: false
        default: ""

      region:
        description: "指定地區，例如 台北；多地區用逗號，例如 新竹,桃園；留空則全部地區"
        required: false
        default: ""

      action:
        description: "執行功能，例如 create_period"
        required: false
        default: "create_period"

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduler
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          NOTIFY_EMAIL:           ${{ secrets.NOTIFY_EMAIL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID:              ${{ secrets.LINE_USER_ID }}
          FORCE_PERIOD:           ${{ github.event.inputs.period }}
          FORCE_REGION:           ${{ github.event.inputs.region }}
          FORCE_ACTION:           ${{ github.event.inputs.action }}
        run: |
          CMD="python -m modules.scheduler_service --force"

          if [ -n "$FORCE_PERIOD" ]; then
            CMD="$CMD --period $FORCE_PERIOD"
          fi

          if [ -n "$FORCE_REGION" ]; then
            CMD="$CMD --region $FORCE_REGION"
          fi

          if [ -n "$FORCE_ACTION" ]; then
            CMD="$CMD --action $FORCE_ACTION"
          fi

          echo "Execute: $CMD"
          eval "$CMD"
