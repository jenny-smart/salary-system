- name: Run period scheduler
  shell: bash
  env:
    JENNY_GOOGLE_TOKEN: ${{ secrets.JENNY_GOOGLE_TOKEN }}
    GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

    LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
    LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
    NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

    FORCE_PERIOD: ${{ github.event.inputs.period }}
    FORCE_REGION: ${{ github.event.inputs.region }}
    FORCE_ACTION: ${{ github.event.inputs.action }}
    EVENT_NAME: ${{ github.event_name }}

  run: |
    set -Eeuo pipefail

    ACTION="${FORCE_ACTION:-create_period}"
    REGION="${FORCE_REGION:-}"

    # 自動排程只執行五區，不執行新北
    if [[ "$EVENT_NAME" == "schedule" ]]; then
      REGION="台北,台中,桃園,新竹,高雄"
    fi

    CMD=(
      python
      -m
      modules.scheduler_service
      --force
      --action
      "$ACTION"
    )

    if [[ -n "${FORCE_PERIOD:-}" ]]; then
      CMD+=(--period "$FORCE_PERIOD")
    fi

    if [[ -n "$REGION" ]]; then
      CMD+=(--region "$REGION")
    fi

    echo "觸發方式：$EVENT_NAME"
    echo "執行功能：$ACTION"
    echo "執行地區：${REGION:-全部地區}"
    echo "指定期別：${FORCE_PERIOD:-自動判斷}"

    "${CMD[@]}"
