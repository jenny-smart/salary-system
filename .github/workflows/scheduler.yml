# .github/workflows/scheduler.yml
#
# Lemon Clean 期別資料夾自動排程
#
# 觸發時機：
#   - GitHub Actions 每 5 分鐘喚醒一次
#   - scheduler_service.py 會讀 config.yaml 判斷是否真的執行
#   - 也可以在 GitHub Actions 頁面手動觸發
#
# 手動觸發：
#   force = true  → 忽略排程日判斷，立即執行
#   period 留空  → 自動依今天日期判斷期別
#   period 有值  → 指定期別，例如 202606-1
#
# GitHub Secrets 需要設定：
#   OAUTH_CLIENT_ID
#   OAUTH_CLIENT_SECRET
#   OAUTH_REFRESH_TOKEN
#   NOTIFY_EMAIL

name: Lemon Clean 期別排程

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "強制執行（忽略排程日判斷，測試用）"
        required: false
        default: "false"

      period:
        description: "指定期別，例如 202606-1；留空則自動判斷"
        required: false
        default: ""

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write credentials to env
        env:
          OAUTH_CLIENT_ID:     ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          NOTIFY_EMAIL:        ${{ secrets.NOTIFY_EMAIL }}
        run: |
          echo "OAUTH_CLIENT_ID=$OAUTH_CLIENT_ID"         >> $GITHUB_ENV
          echo "OAUTH_CLIENT_SECRET=$OAUTH_CLIENT_SECRET" >> $GITHUB_ENV
          echo "OAUTH_REFRESH_TOKEN=$OAUTH_REFRESH_TOKEN" >> $GITHUB_ENV
          echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"               >> $GITHUB_ENV

      - name: Run scheduler
        env:
          OAUTH_CLIENT_ID:     ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          NOTIFY_EMAIL:        ${{ secrets.NOTIFY_EMAIL }}
          FORCE_RUN:           ${{ github.event.inputs.force }}
          FORCE_PERIOD:        ${{ github.event.inputs.period }}
        run: |
          CMD="python -m modules.scheduler_service"

          if [ -n "$FORCE_PERIOD" ]; then
            CMD="$CMD --period $FORCE_PERIOD"
          fi

          if [ "$FORCE_RUN" = "true" ]; then
            CMD="$CMD --force"
          else
            CMD="$CMD --run-once"
          fi

          echo "Execute: $CMD"
          eval "$CMD"
