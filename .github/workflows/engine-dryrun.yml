name: 試跑（只寫入複本）
on:
  push:
    branches:
      - "dryrun/**"
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run dry run
        env:
          JENNY_GOOGLE_TOKEN: ${{ secrets.JENNY_GOOGLE_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          DRYRUN_CLEANING_ID: 15no1_Be6BfASXUBZ7F--GmACdJcsvkA8jTIO550Ojak
        run: python scripts/template_dryrun.py
