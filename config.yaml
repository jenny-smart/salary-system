# .github/workflows/scheduler.yml
#
# Lemon Clean 期別資料夾自動排程
#
# 自動排程：
#   GitHub Actions 每 5 分鐘喚醒一次
#   python -m modules.scheduler_service --run-once
#   → 由 config.yaml 判斷今天是否真的執行
#
# 手動執行：
#   Actions → Lemon Clean 期別排程 → Run workflow
#   period 留空：自動判斷目前期別
#   period 有值：指定期別，例如 202606-2
#   region 留空：全部地區
#   region 有值：只跑指定地區，例如 台北
#
# GitHub Secrets 需要設定：
#   OAUTH_CLIENT_ID
#   OAUTH_CLIENT_SECRET
#   OAUTH_REFRESH_TOKEN
#   NOTIFY_EMAIL

name: Lemon Clean 期別排程

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      period:
        description: "指定期別，例如 202606-2；留空則自動判斷"
        required: false
        default: ""

      region:
        description: "指定地區，例如 台北；留空則全部地區"
        required: false
        default: ""

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write credentials to env
        env:
          OAUTH_CLIENT_ID:     ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          NOTIFY_EMAIL:        ${{ secrets.NOTIFY_EMAIL }}
        run: |
          echo "OAUTH_CLIENT_ID=$OAUTH_CLIENT_ID"         >> $GITHUB_ENV
          echo "OAUTH_CLIENT_SECRET=$OAUTH_CLIENT_SECRET" >> $GITHUB_ENV
          echo "OAUTH_REFRESH_TOKEN=$OAUTH_REFRESH_TOKEN" >> $GITHUB_ENV
          echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"               >> $GITHUB_ENV

      - name: Run scheduler
        env:
          OAUTH_CLIENT_ID:     ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          NOTIFY_EMAIL:        ${{ secrets.NOTIFY_EMAIL }}
          FORCE_PERIOD:        ${{ github.event.inputs.period }}
          FORCE_REGION:        ${{ github.event.inputs.region }}
          EVENT_NAME:          ${{ github.event_name }}
        run: |
          CMD="python -m modules.scheduler_service"

          if [ -n "$FORCE_PERIOD" ]; then
            CMD="$CMD --period $FORCE_PERIOD"
          fi

          if [ -n "$FORCE_REGION" ]; then
            CMD="$CMD --region $FORCE_REGION"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CMD="$CMD --force"
          else
            CMD="$CMD --run-once"
          fi

          echo "Execute: $CMD"
          eval "$CMD"
